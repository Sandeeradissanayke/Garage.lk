<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Owner Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h2 {
            color: #facc15;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .login-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error-msg {
            color: #ef4444;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>GARAGE.lk<br><span style="font-size: 18px; color: white;">Owner Login</span></h2>

        <div class="input-group">
            <label>Email Address (ඊමේල් ලිපිනය)</label>
            <input type="email" id="email" placeholder="garage@example.com" required>
        </div>

        <div class="input-group">
            <label>Password (මුරපදය)</label>
            <input type="password" id="password" placeholder="********" required>
        </div>

        <button class="login-btn" onclick="loginOwner()">Login to Dashboard</button>
        <p class="error-msg" id="errorMsg">ඊමේල් ලිපිනය හෝ මුරපදය වැරදියි!</p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <script>
        // 1. ඔබගේ Firebase Config එක මෙතනට දාන්න
        const firebaseConfig = {
            apiKey: "AIzaSyCDqryDjXE4mipP-sAxhEsX_j9-mr2gli0",
            authDomain: "garage-lk-c27a9.firebaseapp.com",
            projectId: "garage-lk-c27a9",
            storageBucket: "ඔබගේ_STORAGE_BUCKET",
            messagingSenderId: "ඔබගේ_MESSAGING_SENDER_ID",
            appId: "ඔබගේ_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // ලොගින් වීමේ ක්‍රියාවලිය
        function loginOwner() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if (email === "" || password === "") {
                errorMsg.innerText = "කරුණාකර ඊමේල් ලිපිනය සහ මුරපදය ඇතුළත් කරන්න.";
                errorMsg.style.display = "block";
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // ලොගින් වීම සාර්ථක නම් Dashboard එකට යවන්න
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    // ලොගින් වීම අසාර්ථක නම් දෝෂය පෙන්වන්න
                    errorMsg.innerText = "ඊමේල් ලිපිනය හෝ මුරපදය වැරදියි! නැවත උත්සාහ කරන්න.";
                    errorMsg.style.display = "block";
                    console.error(error.message);
                });
        }
    </script>
</body>

</html>
