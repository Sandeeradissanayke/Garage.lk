<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Owner Dashboard</title>
    <!-- CSS ෆයිල් එක සම්බන්ධ කිරීම -->
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <div class="header">
        <h2>⚙️ Garage.lk - Dashboard</h2>
        <div>
            <span id="status" class="status-checking">පරීක්ෂා කරමින් පවතී...</span>
            <button class="logout-btn" onclick="logout()" id="logoutBtn" style="display:none;">Logout (ඉවත්
                වන්න)</button>
        </div>
    </div>

    <!-- අලුත් ඉල්ලීම් පෙන්වන කොටස -->
    <div class="requests-container" id="requestsList">
        <h3>නව ඉල්ලීම් බලාපොරොත්තුවෙන්...</h3>
    </div>

    <hr class="divider">

    <!-- භාරගත් ඉල්ලීම් පෙන්වන කොටස -->
    <div class="requests-container" id="acceptedRequestsList">
        <h3>✅ භාරගත් ඉල්ලීම් (Accepted)</h3>
        <p class="empty-msg">දැනට භාරගත් ඉල්ලීම් නොමැත.</p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <!-- JavaScript ෆයිල් එක සම්බන්ධ කිරීම -->
    <script src="dashboard.js"></script>
</body>

</html>
